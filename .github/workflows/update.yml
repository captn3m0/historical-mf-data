name: Update Data
on:
  schedule:
    # This runs at 4AM UTC
    # = 09:30 IST
    - cron: '0 4 * * *'
  push:
    branches:
      - main
jobs:
  update:
    name: Update data
    runs-on: ubuntu-latest
    steps:
    - name: Record start time
      run: echo "RUN_START=$(date +%s)" >> "$GITHUB_ENV"
    - name: Get current date
      uses: josStorer/get-current-time@6826799222c9d913068c04cb99e67f34dbf3caae # v2.1.3
      id: current-time
      with:
        format: "YYYY.MM.DD"
        timezone: 'Asia/Kolkata'
    - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      name: Checkout (Default Branch)
      if: ${{ github.event_name == 'push' }}
      with:
        fetch-depth: 1
    - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      name: Checkout Main
      if: ${{ github.event_name == 'schedule' }}
      with:
        fetch-depth: 1
        ref: 'main'
    - name: Update data
      run: ./fetch.sh
    - uses: stefanzweifel/git-auto-commit-action@4a55954c782fc1ea30b9056cd3e7a2b40ca8887d # v7.2.0
      id: commit
      with:
        commit_message: Update Historical Data
        commit_author: 'github-actions[bot] <github-actions[bot]@users.noreply.github.com>'
    - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
      with:
        python-version: 'pypy3.11'
    - name: Create Dataset
      run: |
        pypy3 generate.py
        zstd -5 -T0 funds.db
        git config user.email "github-actions[bot]@users.noreply.github.com"
        git config user.name "github-actions[bot]"
    - name: Publish Stable Release (Schedule)
      run: |
        gh release create "v${{ steps.current-time.outputs.formattedTime }}" --notes "Historical Mutual Fund Data as per ${{ steps.current-time.outputs.formattedTime }}. Please see README for index creation, usage, and schema." *.zst
      env:
        GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
      if: ${{ github.event_name == 'schedule' }}
    - name: Publish Pre Release
      run: |
        gh release create "v${{ steps.current-time.outputs.formattedTime }}-pre+${{github.sha}}" --notes "Historical Mutual Fund Data as per ${{ steps.current-time.outputs.formattedTime }}. Please see README for index creation, usage, and schema. This is a pre-release, and not considered stable." *.zst
      env:
        GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
      if: ${{ github.event_name == 'push' }}
    - name: Push metrics
      if: ${{ !cancelled() && github.event_name == 'schedule' }}
      env:
        JOB_STATUS: ${{ job.status }}
        GRAFANA_INFLUX_URL: ${{ vars.GRAFANA_INFLUX_URL }}
        GRAFANA_INFLUX_USER: ${{ vars.GRAFANA_INFLUX_USER }}
        GRAFANA_INFLUX_TOKEN: ${{ secrets.GRAFANA_INFLUX_TOKEN }}
      run: |
        repo="${GITHUB_REPOSITORY#*/}"
        days=$(find data -name '*.csv' | wc -l)
        added=$(git diff --name-only --diff-filter=A "$GITHUB_SHA" HEAD -- data 2>/dev/null | wc -l)
        updated=$(git diff --name-only --diff-filter=M "$GITHUB_SHA" HEAD -- data 2>/dev/null | wc -l)
        latest=$(find data -name '*.csv' | sort | tail -n 1)
        latest_navs=$(grep -cE '^[0-9]+;' "$latest" 2>/dev/null || true)
        nav_date=$(grep -m1 -oE '[0-9]{2}-[A-Za-z]{3}-[0-9]{4}' "$latest" 2>/dev/null | tr - ' ' || true)
        nav_ts=$( [ -n "$nav_date" ] && date -d "$nav_date" +%s 2>/dev/null || echo 0)
        read -r schemes isins navs <<< "$( [ -f funds.db ] && sqlite3 -readonly -separator ' ' funds.db \
          'SELECT (SELECT count(*) FROM schemes), (SELECT count(*) FROM securities), (SELECT count(*) FROM nav)' 2>/dev/null || echo 0 0 0)"
        {
          # NAV archive size, this run's new or backfilled days, and freshness of the newest NAV date
          [ "$nav_ts" -gt 0 ] && echo "mf_nav,repo=$repo days=$days,days_added=$added,days_updated=$updated,latest_navs=${latest_navs:-0},latest_age_days=$(( ($(date +%s) - nav_ts) / 86400 )),schemes=${schemes:-0},isins=${isins:-0},nav_rows=${navs:-0}"
          echo "scrape_run,repo=$repo success=$([ "$JOB_STATUS" = success ] && echo 1 || echo 0),duration_seconds=$(( $(date +%s) - RUN_START )),changed=$([ "$(git rev-parse HEAD)" != "$GITHUB_SHA" ] && echo 1 || echo 0)"
        } > "$RUNNER_TEMP/metrics.txt"
        cat "$RUNNER_TEMP/metrics.txt"
        [ -n "$GRAFANA_INFLUX_TOKEN" ] || exit 0
        curl -fsS --max-time 10 -u "$GRAFANA_INFLUX_USER:$GRAFANA_INFLUX_TOKEN" \
          --data-binary "@$RUNNER_TEMP/metrics.txt" "$GRAFANA_INFLUX_URL/api/v1/push/influx/write" \
          || echo "::warning::Could not push metrics"
