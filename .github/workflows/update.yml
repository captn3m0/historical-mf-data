name: Update Data
on:
  schedule:
    # This runs at 4AM UTC
    # = 09:30 IST
    - cron: '0 4 * * *'
  push:
    branches:
      - main
jobs:
  update:
    name: Update data
    runs-on: ubuntu-latest
    steps:
    - name: Get current date
      uses: josStorer/get-current-time@6826799222c9d913068c04cb99e67f34dbf3caae # v2.1.3
      id: current-time
      with:
        format: "YYYY.MM.DD"
        timezone: 'Asia/Kolkata'
    - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      name: Checkout (Default Branch)
      if: ${{ github.event_name == 'push' }}
      with:
        fetch-depth: 1
    - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      name: Checkout Main
      if: ${{ github.event_name == 'schedule' }}
      with:
        fetch-depth: 1
        ref: 'main'
    - name: Update data
      run: ./fetch.sh
    - uses: stefanzweifel/git-auto-commit-action@4a55954c782fc1ea30b9056cd3e7a2b40ca8887d # v7.2.0
      id: commit
      with:
        commit_message: Update Historical Data
        commit_author: 'github-actions[bot] <github-actions[bot]@users.noreply.github.com>'
    - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
      with:
        python-version: 'pypy3.11'
    - name: Create Dataset
      run: |
        pypy3 generate.py
        zstd -5 -T0 funds.db
        git config user.email "github-actions[bot]@users.noreply.github.com"
        git config user.name "github-actions[bot]"
    - name: Publish Stable Release (Schedule)
      run: |
        gh release create "v${{ steps.current-time.outputs.formattedTime }}" --notes "Historical Mutual Fund Data as per ${{ steps.current-time.outputs.formattedTime }}. Please see README for index creation, usage, and schema." *.zst
      env:
        GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
      if: ${{ github.event_name == 'schedule' }}
    - name: Publish Pre Release
      run: |
        gh release create "v${{ steps.current-time.outputs.formattedTime }}-pre+${{github.sha}}" --notes "Historical Mutual Fund Data as per ${{ steps.current-time.outputs.formattedTime }}. Please see README for index creation, usage, and schema. This is a pre-release, and not considered stable." *.zst
      env:
        GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
      if: ${{ github.event_name == 'push' }}
